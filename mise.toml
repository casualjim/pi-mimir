redactions = ["*_TOKEN", "*_SECRET", "*_KEY", "*_PASSWORD"]

[tools]
biome = "latest"
fnox = "latest"
node = "24"
pnpm = "latest"

[secrets.fnox]


[tasks."test:integration"]
description = "Build and run Docker-backed real Pi integration tests"
secrets = ["ZAI_API_KEY"]
run = """
set -euo pipefail
docker build \
  -f packages/pi-mimir/tests/integration/docker/Dockerfile \
  -t pi-mimir-workflow-e2e \
  .
docker run --rm \
  -e ZAI_API_KEY \
  -e E2E_MODEL \
  --workdir /workspace/pi-mimir-workflow \
  pi-mimir-workflow-e2e \
  pnpm --filter pi-mimir test:e2e
docker run --rm \
  -e ZAI_API_KEY \
  -e E2E_MODEL \
  --workdir /workspace/pi-mimir-workflow \
  pi-mimir-workflow-e2e \
  pnpm --filter @casualjim/pi-caveman test:e2e
"""
