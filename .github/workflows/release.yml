name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Test packages
        run: pnpm test

      - name: Verify package contents
        run: pnpm check:pack

      - name: Publish packages
        run: |
          publish_if_missing() {
            local workspace="$1"
            local package_dir="$2"
            local version
            version=$(node -p "require('./${package_dir}/package.json').version")

            if pnpm view "${workspace}@${version}" version >/dev/null 2>&1; then
              echo "${workspace}@${version} already published; skipping"
              return 0
            fi

            (cd "${package_dir}" && pnpm publish --provenance --access public --no-git-checks)
          }

          publish_if_missing @casualjim/pi-advisor packages/advisor
          publish_if_missing @casualjim/pi-cavekit packages/pi-cavekit
          publish_if_missing @casualjim/pi-caveman packages/pi-caveman
          publish_if_missing @casualjim/pi-codebase-memory packages/pi-codebase-memory
          publish_if_missing @casualjim/pi-heimdall packages/pi-heimdall
publish_if_missing @casualjim/pi-pstack packages/pi-pstack

      - name: Determine bump level
        id: bump
        run: |
          if echo "${{ github.event.head_commit.message || '' }}" | grep -q '\[minor\]'; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          else
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions for next publish
        run: |
          # Deterministic bump; npm version is unreliable on CI (npm regression).
          node -e '
            const fs = require("fs");
            const path = require("path");
            const level = process.argv[1] === "minor" ? "minor" : "patch";
            for (const d of fs.readdirSync("packages")) {
              const f = path.join("packages", d, "package.json");
              if (!fs.existsSync(f)) continue;
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (!pkg.version) continue;
              const [maj, min, pat] = pkg.version.split(".").map(Number);
              pkg.version = level === "minor" ? `${maj}.${min + 1}.0` : `${maj}.${min}.${pat + 1}`;
              fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + "\n");
            }
          ' "${{ steps.bump.outputs.level }}"
          pnpm install --lockfile-only --ignore-scripts

      - name: Commit version bump
        run: |
          NEXT_VERSION=$(node -p "require('./packages/pi-heimdall/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml packages/*/package.json
          git commit -m "chore: bump package versions to ${NEXT_VERSION} [skip ci]"
          git push origin HEAD:main
