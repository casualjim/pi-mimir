name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck packages
        run: npm run typecheck

      - name: Test packages
        run: npm test

      - name: Verify package contents
        run: npm run check:pack

      - name: Publish packages
        run: |
          npm publish --workspace @casualjim/pi-advisor --provenance --access public
          npm publish --workspace @casualjim/pi-cavekit --provenance --access public
          npm publish --workspace @casualjim/pi-caveman --provenance --access public
          npm publish --workspace @casualjim/pi-codebase-memory --provenance --access public
          npm publish --workspace @casualjim/pi-mimir --provenance --access public

      - name: Determine bump level
        id: bump
        run: |
          if echo "${{ github.event.head_commit.message || '' }}" | grep -q '\[minor\]'; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          else
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions for next publish
        run: |
          npm version ${{ steps.bump.outputs.level }} --workspaces --no-git-tag-version
          npm install --package-lock-only --ignore-scripts

      - name: Commit version bump
        run: |
          NEXT_VERSION=$(node -p "require('./packages/pi-mimir/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/*/package.json
          git commit -m "chore: bump package versions to ${NEXT_VERSION} [skip ci]"
          git push origin HEAD:main
