name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Test packages
        run: pnpm test

      - name: Verify package contents
        run: pnpm check:pack

      - name: Publish packages
        run: |
          publish_if_missing() {
            local workspace="$1"
            local package_dir="$2"
            local version
            version=$(node -p "require('./${package_dir}/package.json').version")

            if pnpm view "${workspace}@${version}" version >/dev/null 2>&1; then
              echo "${workspace}@${version} already published; skipping"
              return 0
            fi

            (cd "${package_dir}" && pnpm publish --provenance --access public --no-git-checks)
          }

          publish_if_missing @casualjim/pi-advisor packages/advisor
          publish_if_missing @casualjim/pi-cavekit packages/pi-cavekit
          publish_if_missing @casualjim/pi-caveman packages/pi-caveman
          publish_if_missing @casualjim/pi-codebase-memory packages/pi-codebase-memory
          publish_if_missing @casualjim/pi-heimdall packages/pi-heimdall

      - name: Determine bump level
        id: bump
        run: |
          if echo "${{ github.event.head_commit.message || '' }}" | grep -q '\[minor\]'; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          else
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions for next publish
        run: |
          # npm version keeps package.json version-bump semantics; pnpm owns workspace install/lockfile.
          pnpm -r exec npm version ${{ steps.bump.outputs.level }} --no-git-tag-version
          pnpm install --lockfile-only --ignore-scripts

      - name: Commit version bump
        run: |
          NEXT_VERSION=$(node -p "require('./packages/pi-heimdall/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml packages/*/package.json
          git commit -m "chore: bump package versions to ${NEXT_VERSION} [skip ci]"
          git push origin HEAD:main
