name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.4.1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck packages
        run: npm run typecheck

      - name: Test packages
        run: npm test

      - name: Verify package contents
        run: npm run check:pack
