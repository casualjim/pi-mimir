<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual checkpoints and stacks banner</title>
  <desc id="desc">A connected visual showing checkpoints, a coding-agent core, and stacked pull request layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07172a" />
      <stop offset="55%" stop-color="#102f4c" />
      <stop offset="100%" stop-color="#1d486b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#80ecff" />
      <stop offset="50%" stop-color="#77ffe0" />
      <stop offset="100%" stop-color="#9dffa3" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c456c" />
      <stop offset="100%" stop-color="#133554" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#87f0ff" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#87f0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" />
  <rect width="1200" height="320" fill="url(#halo)" />

